<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Укрзалізниця Lite</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">🚆 Укрзалізниця Lite</a>
            </div>
            <div class="nav-links">
                <a href="index.html">Головна</a>
                <a href="variant-page1.html">Квитки</a>
                <a href="variant-page2.html">Рейси</a>
                <a href="variant-page3.html">Пасажири</a>
                <a href="users.html">Користувачі</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="form-container">
            <h2>Вхід до системи</h2>

            <div class="notification info">
                Демонстраційна версія. Для входу використовуйте: admin / admin
            </div>

            <form action="users.html" method="get">
                <div class="form-group">
                    <label for="username">Логін</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Введіть ваш логін">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Введіть пароль">
                </div>

                <div class="form-group">
                    <label for="role">Тип користувача</label>
                    <select id="role" name="role" class="form-select">
                        <option value="admin">Адміністратор</option>
                        <option value="regular">Звичайний користувач</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Увійти</button>
                    <a href="index.html" class="btn btn-outline">Скасувати</a>
                </div>
            </form>

            <p class="text-center mt-4">
                Ще немає акаунту? <a href="user-create-dialog.html">Зареєструватися</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Укрзалізниця Lite. Всі права захищено.</p>
        </div>
    </footer>
</body>
</html>
