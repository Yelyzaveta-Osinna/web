<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування користувача - Укрзалізниця Lite</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">🚆 Укрзалізниця Lite</a>
            </div>
            <div class="nav-links">
                <a href="index.html">Головна</a>
                <a href="variant-page1.html">Квитки</a>
                <a href="variant-page2.html">Рейси</a>
                <a href="variant-page3.html">Пасажири</a>
                <a href="users.html">Користувачі</a>
            </div>
            <div class="user-info">
                <span class="username">👤 Admin</span>
                <a href="index.html" class="btn btn-outline">Вийти</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="form-container">
            <h2>Редагування користувача #1</h2>
            
            <div class="notification info">
                Демонстраційна версія. Зміни не зберігаються.
            </div>

            <form action="user-detail.html?id=1" method="get">
                <div class="form-group">
                    <label for="username">Логін *</label>
                    <input type="text" id="username" class="form-control" value="admin@railway.com">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" class="form-control" value="admin@railway.com">
                </div>

                <div class="form-group">
                    <label for="fullname">Повне ім'я</label>
                    <input type="text" id="fullname" class="form-control" value="Адміністратор Системи">
                </div>

                <div class="form-group">
                    <label for="role">Роль *</label>
                    <select id="role" class="form-select">
                        <option value="admin" selected>Адміністратор</option>
                        <option value="regular">Звичайний користувач</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="newPassword">Новий пароль (залиште порожнім, якщо не змінюєте)</label>
                    <input type="password" id="newPassword" class="form-control">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Підтвердіть новий пароль</label>
                    <input type="password" id="confirmPassword" class="form-control">
                </div>

                <div class="form-group">
                    <label for="status">Статус</label>
                    <select id="status" class="form-select">
                        <option value="active" selected>Активний</option>
                        <option value="inactive">Неактивний</option>
                        <option value="blocked">Заблокований</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Зберегти зміни</button>
                    <a href="user-detail.html?id=1" class="btn btn-outline">Скасувати</a>
                    <a href="users.html" class="btn btn-danger">Видалити користувача</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Укрзалізниця Lite. Всі права захищено.</p>
        </div>
    </footer>
</body>
</html>
